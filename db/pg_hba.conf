# Client authentication.
#
# The database port is not published by docker-compose, so "all addresses" below
# means "other containers on this compose network" and nothing else.
#
# hh_worker is trusted because it is a service account with nowhere to store a
# password. Every other role must present one, because for the API a successful
# connection IS the authentication: if these were trust, HTTP Basic would verify
# nothing and anyone could act as any headhunter.

# TYPE   DATABASE   USER         ADDRESS        METHOD

local    all        all                         trust

host     all        hh_worker    samenet         trust
host     all        hh_worker    127.0.0.1/32    trust
host     all        hh_worker    ::1/128         trust

host     all        all          all             scram-sha-256
