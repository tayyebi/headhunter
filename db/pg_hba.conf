# Client authentication.
#
# The database sits on an internal Docker network with no route to the outside
# world and no published port. The only things that can open a socket to it are
# the api and worker containers, which are the same codebase.
#
# That is the entire boundary, so the application role has no password. Users are
# application data now (see the users and sessions tables), not database roles.

# TYPE   DATABASE   USER   ADDRESS    METHOD

local    all        all               trust
host     all        all    samenet    trust
host     all        all    all        reject
